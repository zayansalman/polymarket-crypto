name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install package
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # Ruff is a hard gate: it must pass for the build to be green.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned: an unpinned install picked up ruff 0.16's wider default rule set
        # and turned CI red with hundreds of new findings overnight.
        run: pip install ruff==0.15.12

      - name: Ruff check
        run: ruff check polymarket_exec/ polymarket_bot/ tests/ tools/

  # (mypy retired at archive, 2026-07-11) It was always advisory
  # (continue-on-error) and never a merge gate; the type-cleanup epic (#81) was
  # closed unfinished at archive, so an advisory job that can only ever show red
  # adds noise, not signal. The enforced gates are tests (3.11/3.12), ruff, and
  # docs-drift — all green.

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[test]"

      - name: Regenerate docs and fail on drift
        run: python tools/gen_docs.py --check

      - name: Fail on banned stale strings
        run: |
          ! grep -rn -e "No live orders" -e "no private key required" \
            -e "321 tests" -e "gradio.Blocks" -e "live trading is intentionally absent" \
            README.md AGENTS.md CLAUDE.md docs/
