<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Polymarket Crypto EMS{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">POLYMARKET CRYPTO <b>EMS</b></div>
      <div class="controls">
        <div class="sse-indicator" title="Live connection">
          <span class="sse-dot connecting"></span><span class="sse-label">feed</span>
        </div>
        <button class="btn ghost btn-ctl" onclick="handleRefresh()">⟳</button>
      </div>
    </header>

    {% block content %}{% endblock %}
  </div>

  <div class="toast-container"></div>
  <script src="/static/dashboard.js?v={{ static_version }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
