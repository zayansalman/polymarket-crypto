[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-crypto"
version = "0.2.0"
description = "Local research and shadow/paper execution stack for Polymarket crypto binary markets"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "websockets>=12",
    # IANA zones for zoneinfo (Up/Down windows are named in US Eastern time);
    # slim images lack system tzdata.
    "tzdata>=2024.1",
    # Renders docs/strategies/*.md at /docs in the dashboard.
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# (polars + huggingface-hub dropped 2026-09-21: they backed the offline replay
# and Chainlink lead-lag tools, both deleted.)
# (numpy dropped 2026-09-21: it backed tools/regime_attribution.py, #128, which
# no longer exists in the tree — only stale .pyc files remained.)
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]
dev = ["ruff>=0.4", "mypy>=1.9"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ems*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# E402 (module-import-not-at-top): these tests insert the project root into
# sys.path before importing the package, so those imports intentionally follow
# the sys.path bootstrap and cannot be hoisted to the top of the file.
"tests/e2e/test_dashboard_flow.py" = ["E402"]
"tests/unit/test_dashboard.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
